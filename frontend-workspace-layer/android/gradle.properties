# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m

# AndroidX package structure
android.useAndroidX=true
android.enableJetifier=true

# Use this property to specify which architectures you want to build.
# Defaults to arm64-v8a for faster CI builds. Enable more ABIs locally if needed.
reactNativeArchitectures=arm64-v8a

# New Architecture (Fabric + TurboModules)
# Kept off: the custom native modules (StorageBridgePlugin, TerminalBridgePlugin,
# SecureKeystore) use the legacy ReactContextBaseJavaModule API, which runs most
# reliably on the old architecture bridge.
newArchEnabled=false

# Hermes JS engine
hermesEnabled=true
